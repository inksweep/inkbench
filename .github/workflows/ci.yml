# CPU-only tests: scoring, statistics, label transfer, tables and the command line on synthetic data. Prediction
# needs a CUDA GPU and the benchmark data; it is run on a GPU machine with the scripts in node/.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }}, CPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: torch, CPU build
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: inkbench with its test extra (inksweep from PyPI)
        run: python -m pip install -e ".[test]"
      - name: tests
        run: python -m pytest -q -rs
      - name: command line
        run: |
          inkbench --version
          inkbench benchmarks
          inkbench --root "$RUNNER_TEMP/inkbench" reproduction
          inkbench --root "$RUNNER_TEMP/inkbench" table --n-boot 10 > /dev/null
      - name: node scripts parse
        run: for f in node/*.sh; do bash -n "$f"; done
